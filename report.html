
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a Problem | CampusCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a class="logo" href="index.html">🏫 CampusCare</a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a class="active" href="report.html">Report Problem</a>
    <a href="complaints.html">My Complaints</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<main class="page-section">
  <div class="form-card">
    <span class="eyebrow">WE ARE HERE TO HELP</span>
    <h1>Report a Problem</h1>
    <p class="muted">Tell us about the issue you are facing on campus.</p>

    <form id="reportForm">
      <label for="studentName">Your Name</label>
      <input type="text" id="studentName" placeholder="Enter your name" required>

      <label for="studentEmail">College Email</label>
      <input type="email" id="studentEmail" placeholder="Enter your email" required>

      <label for="category">Problem Category</label>
      <select id="category" required>
        <option value="">Select a category</option>
        <option>Classroom</option>
        <option>Electricity</option>
        <option>Wi-Fi / Internet</option>
        <option>Hostel</option>
        <option>Library</option>
        <option>Cleanliness</option>
        <option>Water Supply</option>
        <option>Other</option>
      </select>

      <label for="problemTitle">Problem Title</label>
      <input type="text" id="problemTitle"
             placeholder="e.g. Wi-Fi is not working" required>

      <label for="problemDetails">Problem Description</label>
      <textarea id="problemDetails" rows="5"
                placeholder="Explain the problem in detail..." required></textarea>

      <label for="location">Problem Location</label>
      <input type="text" id="location"
             placeholder="e.g. Block A, Room 101" required>

      <button class="btn btn-primary full-width" type="submit">
        Submit Complaint
      </button>
      <p id="formMessage" class="form-message" role="status"></p>
    </form>
  </div>
</main>

<footer class="footer">
  © 2026 CampusCare | Student Problem Reporting System
</footer>

<script src="script.js"></script>
</body>
</html>
