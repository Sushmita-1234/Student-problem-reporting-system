
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CampusCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a class="logo" href="index.html">🏫 CampusCare</a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="report.html">Report Problem</a>
    <a href="complaints.html">My Complaints</a>
    <a class="active" href="login.html">Login</a>
  </nav>
</header>

<main class="page-section login-section">
  <div class="form-card login-card">
    <div class="login-icon">🔐</div>
    <span class="eyebrow">WELCOME BACK</span>
    <h1>Student Login</h1>
    <p class="muted">Enter your email to continue.</p>

    <form id="loginForm">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail"
             placeholder="Enter your email" required>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword"
             placeholder="Enter your password" required>

      <button type="submit" class="btn btn-primary full-width">
        Sign In
      </button>
      <p id="loginMessage" class="form-message" role="status"></p>
    </form>

    <p class="small-note">
      Demo only: use the Report Problem page to try submitting a complaint.
    </p>
    <a class="back-link" href="index.html">← Back to Home</a>
  </div>
</main>

<footer class="footer">
  © 2026 CampusCare | Student Problem Reporting System
</footer>

<script src="script.js"></script>
</body>
</html>
